<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 520" width="100%" height="100%">
  <rect width="400" height="520" fill="#08080a" rx="16" />
  <rect x="2" y="2" width="396" height="516" fill="none" stroke="#27272a" stroke-width="2" rx="14" />
  
  <!-- Top Tag < > -->
  <text x="200" y="145" fill="#f4f4f5" font-family="'JetBrains Mono', monospace" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="6">&lt; &gt;</text>
  
  <!-- Middle Line 1: I l♡ve -->
  <text x="200" y="240" font-family="'JetBrains Mono', monospace" font-size="48" font-weight="700" text-anchor="middle" letter-spacing="3">
    <tspan fill="#ffffff">I </tspan>
    <tspan fill="#ea580c">l</tspan>
    <tspan fill="#ea580c">♡</tspan>
    <tspan fill="#ea580c">ve</tspan>
  </text>
  
  <!-- Middle Line 2: coding -->
  <text x="200" y="325" fill="#f4f4f5" font-family="'JetBrains Mono', monospace" font-size="48" font-weight="700" text-anchor="middle" letter-spacing="2">coding</text>
  
  <!-- Bottom Tag </ > -->
  <text x="200" y="415" fill="#f4f4f5" font-family="'JetBrains Mono', monospace" font-size="40" font-weight="700" text-anchor="middle" letter-spacing="6">&lt;/ &gt;</text>
</svg>
